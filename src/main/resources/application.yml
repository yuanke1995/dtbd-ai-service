server:
  port: 8090
  servlet:
    context-path: /ai

spring:
  application:
    name: dtbd-ai-service

  # 数据库（独立库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.168.10.65:2881/dtbd_ai?useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&nullCatalogMeansCurrent=true
    username: root
    password: ${DB_PASSWORD:OceanBase_123#}

  # Redis Stack（向量存储）
  data:
    redis:
      host: ${REDIS_HOST:172.16.9.130}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:wisesoft}
      database: ${REDIS_DB:11}

  ai:
    # LLM 对话：DeepSeek（OpenAI 兼容协议）
    openai:
      api-key: ${AI_DEEPSEEK_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
      # Embedding 单独配置（DeepSeek 无 embedding，需用兼容 OpenAI 协议的向量服务）
      embedding:
        api-key: ${AI_EMBEDDING_KEY:}
        base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}

    # Redis 向量库配置
    vectorstore:
      redis:
        initialize-schema: true
        index-name: dtbd-ai-index
        prefix: "ai:chunk:"

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义 AI 配置
ai-app:
  # 文档分块
  chunk:
    max-size: 800
    overlap: 100
  # 检索
  retrieval:
    top-k: 5
    similarity-threshold: 0.5
  # 会话
  session:
    max-history: 10
    expire-minutes: 30
  # 允许访问的来源（dtbd-core 服务地址，用于鉴权）
  trusted-token: ${AI_TRUSTED_TOKEN:dtbd-ai-internal-token}

logging:
  level:
    com.wisesoft.ai: debug
    org.springframework.ai: info