server:
  port: 8090
  servlet:
    context-path: /ai

spring:
  application:
    name: dtbd-ai-service
  profiles:
    active: local

  # 文件上传限制（Word/PDF 等文档，默认 1MB 太小）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # 数据库（独立库，密码必须通过环境变量 DB_PASSWORD 提供，缺失启动即失败）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dtbd_init?useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&nullCatalogMeansCurrent=true
    username: root
    password: ${DB_PASSWORD}

  # 启动时自动执行 schema.sql 建表（CREATE TABLE IF NOT EXISTS，重复执行安全）
  sql:
    init:
      mode: always

  # Redis Stack（向量存储）
  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  ai:
    # LLM 对话：DeepSeek（OpenAI 兼容协议）
    openai:
      api-key: ${AI_DEEPSEEK_KEY:}
      base-url: https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          # 注意：该 MaaS 网关对 qwen-max 返回 DashScope 原生格式(text 字段)，Spring AI 无法解析；
          # qwen-plus 返回标准 OpenAI 格式，流式/非流式均兼容
          model: qwen3.7-flash-2026-07-15
          temperature: 0.3
      # Embedding 单独配置（DeepSeek 无 embedding，需用兼容 OpenAI 协议的向量服务）
      embedding:
        api-key: ${AI_EMBEDDING_KEY:}
        base-url: ${AI_EMBEDDING_BASE_URL:https://llm-xdqpg8ip850vmxh3.cn-beijing.maas.aliyuncs.com/compatible-mode}
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}

    # Redis 向量库配置
    vectorstore:
      redis:
        initialize-schema: true
        index: dtbd-ai-index
        prefix: "ai:chunk:"

# MyBatis-Plus（SQL 日志默认走 slf4j，级别由 LOG_LEVEL_SQL 控制）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义 AI 配置
ai-app:
  # 文档分块
  chunk:
    max-size: 800
    overlap: 100
  # 检索
  retrieval:
    top-k: 5
    similarity-threshold: 0.5
  # 会话
  session:
    max-history: 10
    expire-minutes: 30
  # 文档图片提取
  images:
    # 数据根目录（源文件/图片落盘）。必须是稳定绝对路径：
    # 相对路径在 Tomcat/war 部署下会解析到临时解压目录（重启即清空导致上传失败）
    dir: ${AI_IMAGES_DIR:D:/workspace/dtbd-ai-service/data}
    # 图片压缩：最长边像素，超过则等比缩小（0=不压缩）。
    # 768 是"识别速度"与"截图文字清晰度"的平衡点：视觉 token 数约为 1280 的 1/3，推理显著提速
    max-width: 768
    # JPEG 压缩质量（0~1），带透明通道的图自动转 PNG 无损保留
    quality: 0.8
    url-prefix: /ai/images
    # 图片访问鉴权（HMAC 签名 URL + 过期时间；本地开发默认关闭，生产必须开启 AI_IMAGES_AUTH_ENABLED=true）
    auth-enabled: ${AI_IMAGES_AUTH_ENABLED:false}
    # 签名有效期（秒）
    auth-expire-seconds: 3600
    # 回答中 [图片N] 标记与图片描述的相关性校验（LLM 偶发错配兜底；无描述/无关键词自动放行，不误杀）
    image-filter:
      enabled: ${AI_IMAGE_FILTER_ENABLED:true}
      min-hits: 1
      pre-context-chars: 100
  # 图片描述（本地 Ollama 视觉模型，OpenAI 兼容协议；已实测返回标准 OpenAI 格式）
  vision:
    model: ${AI_VISION_MODEL:qwen3-vl:2b}
    # 约定：base-url 不含 /v1（代码自动拼 /v1/chat/completions）；Ollama 用 http://localhost:11434
    base-url: ${AI_VISION_BASE_URL:http://localhost:11434}
    # Ollama 不校验密钥，此处为占位值；如换回云端服务需改为真实 API Key
    api-key: ${AI_VISION_API_KEY:ollama}
    enabled: true
    # 单张图片描述超时（本地 2B 模型约 29s；文档图多时排队+推理可能超 60s，放宽到 180s 防误降级）
    timeout-millis: 180000
    # 图片描述并发度（本机 4GB 显存建议 2，避免并发压垮 Ollama 导致 500/超时）
    concurrency: 2
    # 单图失败重试次数（Ollama 偶发 500/超时，重试 1 次显著降低"无描述"降级）
    retry-count: 1
    # keep_alive 保持 qwen3-vl 常驻内存，避免每次文档解析都要重新加载模型（云端服务不支持需设 0）
    keep-alive-minutes: 30
    # 关闭思考模式（qwen3 系列默认思考，关闭后提速且输出稳定）
    think: ${AI_VISION_THINK:false}
  # 查询改写（默认关闭，开启后会对用户提问做 LLM 优化后再检索）
  query-rewrite:
    enabled: ${AI_QUERY_REWRITE_ENABLED:true}
    timeout-millis: 5000
  # 内部鉴权 token（与 dtbd-core 一致；必须通过环境变量 AI_TRUSTED_TOKEN 提供，缺失启动即失败）
  trusted-token: ${AI_TRUSTED_TOKEN}

logging:
  level:
    com.wisesoft.ai: ${LOG_LEVEL_APP:info}
    org.springframework.ai: ${LOG_LEVEL_SPRING_AI:info}

# 可观测性：健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}

# SpringDoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false