# ============================================================
# ai-doc-assistant 生产部署 Nginx 配置（独立部署参考）
# 前端 dist/ 与后端服务串联（网关鉴权由平台侧注入 X-Trusted-Token）
# ============================================================

server {
    listen 80;
    server_name _;

    # 文档上传物理上限（与后端 multipart 1GB 一致；业务上限由 c_ai_config upload.maxFileSize 控制）
    client_max_body_size 1024m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 网关透传路径：/api/ai/* → 后端 /ai/api/ai/*
    location /api/ {
        proxy_pass http://app:8090/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 320s;
    }

    # 文档图片静态资源（SSE 之外的普通代理，可缓存）
    location /ai/images/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # SSE 流式接口：必须关闭响应缓冲，否则流式 token 无法实时到达
    location ~* /(api|proxy)/ai/chat {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 320s;
        proxy_set_header X-Accel-Buffering no;
    }
}
