# ============================================================
# dtbd-ai-web 生产部署 Nginx 配置（独立部署参考）
# 生产形态：通常由 dtbd-core 平台网关鉴权透传 /dtbd/api/ai/*，
# 若独立部署，可用本配置将前端 dist/ 与后端服务串联。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 平台网关透传路径：/dtbd/api/ai/* → 后端 /ai/api/ai/*
    # （独立部署时；若经 dtbd-core 网关则此段指向网关地址，由网关转发到后端）
    location /dtbd/ {
        proxy_pass http://app:8090/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 320s;
    }

    # 文档图片静态资源（SSE 之外的普通代理，可缓存）
    location /ai/images/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # SSE 流式接口：必须关闭响应缓冲，否则流式 token 无法实时到达
    location ~* /(dtbd|proxy)/api/ai/chat {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 320s;
        proxy_set_header X-Accel-Buffering no;
    }
}
