# CI：后端编译+纯 JUnit 单测（无外部依赖，无需 DB/Redis）+ 前端构建
# 单测不依赖 Spring 上下文，mvn test 可直接跑；构建即回归（分块/引用识别/签名/缓冲逻辑有测试守护）
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile & unit tests
        run: mvn -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # package-lock.json 在 .gitignore（本地依赖变动频繁），用 npm install 而非 npm ci
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
